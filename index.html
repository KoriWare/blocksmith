<style>

<div class="h"><span id="ttl">My Machines 😼</span><small>● Offline</small></div>
<div class="c" id="v"></div>
<div class="tabs"><button data-t="machines">Machines</button><button data-t="new">New</button><button data-t="recent">Recent</button><button data-t="more">More</button></div>
<script>
const $=s=>document.querySelector(s),V=$('#v');
const PRESETS={'Vertical mills':['Generic 3-axis VMC','Generic VMC w/ 4th axis','Small toolroom mill'],'Horizontal mills':['Generic HMC w/ pallet','Generic HMC 4-axis'],'Lathes':['Generic 2-axis lathe','Lathe w/ live tooling','Lathe w/ sub-spindle']};
const SETS=[['Control','Fanuc-style'],['Units','Inch'],['Rapid rate (in/min)','400'],['Program memory (lines)','8000'],['Probe','none'],['Skip code (probe)','G31',1],['Rigid tap style','M29 S (before G84)',1],['Rotary axis','A',1],['Rotary direction','+ = CCW looking from +X end',1],['Extended offsets','none',1],['Offset syntax','G54.1 Pn',1],['Max RPM','8000']];
const LSETS=[['Control','Fanuc-style'],['Units','Inch'],['Rapid rate (in/min)','400'],['Program memory (lines)','8000'],['Diameter mode','Diameter',1],['Extended offsets','none',1],['Offset syntax','G54.1 Pn',1],['Tool numbering','T0101'],['Max RPM (G50)','3000',1],['Spindle mode','G96 CSS']];
const isLT=t=>/lathe/i.test(t);
function mk(name,type,user){return{id:Date.now()+Math.random(),name,type,s:(isLT(type)?LSETS:SETS).map(([k,v],i)=>({k,v,st:i==0||(isLT(type)?LSETS:SETS)[i][2]?'confirm':(user||[]).includes(k)?'user':'suggested'}))}}
let S=JSON.parse(localStorage.getItem('mc')||'null')||{m:[mk('Mill A','demo VMC',['Units','Rapid rate (in/min)']),mk('Mill B','demo VMC 4th',['Units']),mk('Lathe 1','demo lathe',[])],jobs:[],cur:0};
S.m.forEach(m=>{if((isLT(m.type)&&!m.s.find(x=>x.k=='Diameter mode'))||!m.s.find(x=>x.k=='Extended offsets'))m.s=mk(m.name,m.type).s});
const save=()=>localStorage.setItem('mc',JSON.stringify(S));
function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({machines,new:nw,recent,more})[t]();scrollTo(0,0)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
const pct=m=>Math.round(100*m.s.filter(x=>x.st=='user').length/m.s.length);
const cls={user:'g',suggested:'gr',confirm:'r'},ic={user:'✓',suggested:'~',confirm:'!'};
function machines(){$('#ttl').textContent='My Machines 😼';
V.innerHTML=S.m.map((m,i)=>`<div class="card" onclick="edit(${i})"><div class="t">${i==S.cur?'⭐ ':''}${m.name} <span style="color:#999;font-weight:400">· ${m.type}</span></div><div class="s">${m.s[0].v} · ${m.s[1].v}</div><div class="bar"><i style="width:${pct(m)}%"></i></div><div class="s">Setup ${pct(m)}% · ${m.s.filter(x=>x.st=='confirm').length} to confirm</div>${m.s.map(x=>`<span class="chip ${cls[x.st]}">${ic[x.st]} ${x.k}</span>`).join('')}</div>`).join('')+
`<button class="btn" onclick="addM()">+ Add machine</button><div class="s" style="margin-top:10px">Demo machines only. Green = you set it · gray = suggested · red = confirm on the control.</div>`}
function addM(){$('#ttl').textContent='Presets';V.innerHTML=Object.entries(PRESETS).map(([g,l])=>`<div class="card"><div class="t">${g}</div>${l.map(n=>`<button class="chip gr" onclick="pick('${n}','${g}')">${n}</button>`).join('')}</div>`).join('')+'<div class="s">Not affiliated with any machine maker. Generic presets only.</div>'}
function pick(n,g){S.m.push(mk(n,g.replace(/s$/,'').toLowerCase()));{const m=S.m.at(-1);m.opt=m.opt||{macroB:1};m.optOk=0;m.tools=m.tools||JSON.parse(JSON.stringify((S.m[0]||{}).tools||[]));if(/horizontal/.test(m.type)){const r=m.s.find(x=>x.k=='Rotary axis');if(r)r.v='B';m.opt.ax4=1}}save();edit(S.m.length-1)}
function edit(i){const m=S.m[i];$('#ttl').textContent=m.name;
V.innerHTML=`<div class="card"><input id="mn" value="${m.name}"><div class="bar"><i style="width:${pct(m)}%"></i></div><div class="s">Setup ${pct(m)}%</div>${m.s.map((x,j)=>`<div class="set"><span><span class="chip ${cls[x.st]}" onclick="S.m[${i}].s[${j}].st='user';save();edit(${i})">${ic[x.st]}</span> ${x.k}</span><input style="width:45%" data-j="${j}" value="${x.v}"></div>`).join('')}<div class="s">Editing a value marks it green (you set it). Red items: check them on the control, then tap the red chip to confirm.</div></div><button class="btn" onclick="cur(${i})">Use this machine</button><button class="btn o" onclick="tab('machines')">Back</button>`;
$('#mn').onchange=e=>{m.name=e.target.value;save()};V.querySelectorAll('input[data-j]').forEach(el=>el.onchange=()=>{const x=m.s[el.dataset.j];x.v=el.value;x.st='user';save();edit(i)})}
function cur(i){S.cur=i;save();tab('new')}
// ---------- parser
const W={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12};
let J=null;
function num(re,t){const m=t.match(re);return m?parseFloat(m[1]):null}
function parse(t){t=t.toLowerCase().replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|twelve)\b/g,w=>W[w]);
 const p={},G=(k,v,g)=>p[k]={v,g:!!g};let op;
 if(/bolt ?circle|bc\b|holes? on a/.test(t))op='bolt';else if(/grid|array|rows?|x\s*\d+\s*(holes|grid)/.test(t))op='grid';else if(/face|facing/.test(t))op='face';else return null;
 const d=num(/(-?[\d.]+)\s*(?:"|in)?\s*deep|depth\s*(?:of\s*)?(-?[\d.]+)/,t)??num(/depth\s*(?:of\s*)?([\d.]+)/,t);
 if(op=='bolt'){G('Holes',num(/(\d+)\s*(?:-?\s*hole|x)/,t));G('Dia',num(/([\d.]+)\s*(?:"|in)?\s*(?:dia|diameter|bc|bolt)/,t)??num(/dia(?:meter)?\s*(?:of\s*)?([\d.]+)/,t));
  const a=num(/(?:start(?:ing)?\s*(?:angle|at)?\s*)(-?[\d.]+)/,t);G('Start°',a??0,a==null);}
 if(op=='grid'){const m=t.match(/(\d+)\s*(?:rows?\s*(?:by|x)\s*|x\s*)(\d+)/);G('Rows',m?+m[1]:null);G('Cols',m?+m[2]:null);
  const sp=num(/([\d.]+)\s*(?:"|in)?\s*(?:spacing|apart|pitch)/,t)??num(/spac(?:ing|ed)\s*(?:of\s*)?([\d.]+)/,t);G('Pitch X',sp);G('Pitch Y',num(/([\d.]+)\s*(?:"|in)?\s*y\s*(?:spacing|pitch)/,t)??sp);}
 if(op=='face'){const m=t.match(/([\d.]+)\s*(?:"|in)?\s*(?:x|by)\s*([\d.]+)/);G('Length',m?+m[1]:null);G('Width',m?+m[2]:null);
  const c=num(/([\d.]+)\s*(?:"|in)?\s*(?:cutter|face mill|mill)/,t);G('Cutter',c??2,c==null);const st=num(/stepover\s*([\d.]+)/,t);G('Stepover %',st??70,st==null);}
 if(op=='face'){const z=num(/(?:take|remove|depth)\s*(?:off\s*)?([\d.]+)/,t);G('Depth',z??0.02,z==null)}else G('Depth',d);
 if(op!='face'){const pk=/peck|g83/.test(t);G('Cycle',pk?'Peck G83':'Drill G81',!/peck|drill|g8[13]/.test(t));if(pk){const q=num(/peck\s*(?:of\s*)?([\d.]+)/,t);G('Peck Q',q??0.05,q==null)}}
 if(op!='face'){const dd=num(/([\d.]+)\s*(?:"|in)?\s*drill/,t);G('Drill Ø',dd??0.25,dd==null)}
 const f=num(/\b(?:feed|f)\s*([\d.]+)/,t);G('Feed',f??(op=='face'?30:8),f==null);const r=num(/(?:rpm|s)\s*(\d{3,5})/,t)??num(/(\d{3,5})\s*rpm/,t);G('RPM',r??(op=='face'?3000:2500),r==null);
 const tl=num(/\bt(?:ool)?\s*(\d+)/,t);G('Tool',tl??1,tl==null);G('Clear Z',0.1,true);
 return{op,p,text:t}}
const OPN={bolt:'Bolt circle',grid:'Hole grid',face:'Face mill',lturn:'OD turn',lface:'Lathe face',lgroove:'OD groove',ldrill:'Center drill'};
function nw(){$('#ttl').textContent='New job · '+(S.m[S.cur]||{name:'?'}).name;
V.innerHTML=`<textarea id="q" rows="3" placeholder="${isL()?'e.g. G54 T1 turn 2.0 bar to 1.5 dia 3 long z0 0':'e.g. G54 T2 6 hole bolt circle 3.0 dia center x0 y0 z0 0 start 15 0.5 deep peck'}">${J?J.text:''}</textarea><div class="row" style="margin-top:6px">${isSw()?`<button class="chip y" onclick="ex('G54 swiss turn 0.5 bar to 0.375 dia 0.8 long z0 0 flat 0.05 deep 0.3 long cross drill 0.125 at z-0.55 0.15 deep center drill 0.1 deep part off 0.062')">Combined sample</button><button class="chip gr" onclick="ex('G54 swiss turn 0.5 bar to 0.375 dia 0.8 long z0 0 part off 0.062')">Turn + part-off</button>`:isL()?`<button class="chip gr" onclick="ex('G54 T1 turn 2.0 bar to 1.5 dia 3 long z0 0 chamfer 0.03')">OD turn</button><button class="chip gr" onclick="ex('G54 T1 face 0.05 off 2.0 bar z0 0')">Face</button><button class="chip gr" onclick="ex('G54 T3 groove 0.25 wide 0.1 deep at z-1.0 2.0 bar insert 0.125 z0 0')">Groove</button><button class="chip gr" onclick="ex('G54 T5 center drill 0.5 deep peck 0.1 z0 0')">Drill</button>`:`<button class="chip gr" onclick="ex('G54 T2 6 hole bolt circle 3.0 dia center x0 y0 z0 0 start 15 0.5 deep peck 0.1')">Bolt circle</button><button class="chip gr" onclick="ex('G54 T2 3 x 4 grid 0.75 spacing start x0 y0 z0 0 0.4 deep drill')">Grid</button><button class="chip gr" onclick="ex('G54 T6 rigid tap 1/4-20 4 hole bolt circle 2.0 dia center x0 y0 z0 0 start 45 0.5 deep 600 rpm')">Tap</button><button class="chip gr" onclick="ex('G54 T2 index 4 faces hole x1.0 y0 z0 0.75 0.3 deep drill')">4th axis</button><button class="chip gr" onclick="ex('G54 T20 probe bore 2.0 dia center x0 y0 probe z -0.25 tip 0.157 write to g55')">Probe</button><button class="chip gr" onclick="ex('G54 T1 face 4 x 3 with 2 cutter take off 0.06 stepdown 0.02 stepover 70 z0 0')">Face</button>`}</div><button class="btn" onclick="go()">Make my macro</button><div id="out"></div>`}
function ex(s){$('#q').value=s;go()}
function go(){const j=req((isL()?parseL:parse)($('#q').value));if(!j){$('#out').innerHTML=`<div class="ok bad">${isL()?'Try “turn”, “face”, “groove”, or “center drill”.':'Try “bolt circle”, “grid”, or “face mill”.'}</div>`;return}J={...j,date:Date.now(),edits:{}};show()}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function ed(k){const x=J.p[k],v=prompt(k=='Work offset'?'Work offset — this machine allows: G54–G59'+(extN()?`, ${offLbl('P1')}…${offLbl(offOpts().at(-1))}`:''):k,k=='Work offset'?offLbl(x.v||''):x.v??'');if(v==null)return;x.v=k=='Work offset'?normOff(v):isNaN(+v)?v:+v;x.g=false;show()}
function fill(){V.querySelectorAll('[data-k]').forEach(el=>{if(el.value!=='')J.p[el.dataset.k]={v:el.dataset.k=='Work offset'?normOff(el.value):isNaN(+el.value)?el.value.toUpperCase():+el.value,g:false}});show()}
// ---------- generator: Macro B main + subprogram, and simulated moves
function f4(n){return(+n).toFixed(4).replace(/0+$/,'').replace(/\.$/,'.0')}
function gen(j){const p=k=>j.p[k]?j.p[k].v:0,c=[],mv=[];let pos=[0,0,2],out=0;
 const L=s=>c.push(s);const R=(x,y,z)=>{mv.push({a:[...pos],b:[x??pos[0],y??pos[1],z??pos[2]],r:1});pos=mv.at(-1).b},F=(x,y,z,f)=>{mv.push({a:[...pos],b:[x??pos[0],y??pos[1],z??pos[2]],f});pos=mv.at(-1).b};
 const T=p('Tool'),cz=p('Clear Z');
 L('%');L('O1000 ('+OPN[j.op].toUpperCase()+' - MACRO CATCULATOR DEMO)');L('(GENERIC FANUC-STYLE MACRO B - VERIFY ON CONTROL)');
 L('G17 G20 G40 G49 G80 G90 (SAFE START)');L(`T${T} M06`);L(`${offCode(p('Work offset'))} G00 X0. Y0. S${p('RPM')} M03`);{const sx=j.p['Center X']||j.p['Start X'],sy=j.p['Center Y']||j.p['Start Y'];L(`G52 X${f4(sx?sx.v:0)} Y${f4(sy?sy.v:0)} Z${f4(p('Z0'))} (LOCAL SHIFT TO PART ZERO)`)}L(`G43 H${T} Z${f4(cz+1)} M08`);
 const drill=(x,y)=>{const d=-p('Depth'),q=p('Peck Q');R(x,y,null);R(null,null,cz);if(j.p['Peck Q']){let z=0;while(z>d){const nz=Math.max(d,z-q);F(null,null,nz,p('Feed'));R(null,null,cz);if(nz>d)R(null,null,nz+0.01);z=nz}}else{F(null,null,d,p('Feed'));R(null,null,cz)}};
 const cyc=j.p['Peck Q']?`G83 Z-#26 R#18 Q#17 F#9`:`G81 Z-#26 R#18 F#9`;
 R(0,0,cz+1);
 if(j.op=='bolt'){L(`G65 P9100 H${p('Holes')} D${f4(p('Dia'))} A${f4(p('Start°'))} Z${f4(p('Depth'))} R${f4(cz)} F${f4(p('Feed'))}${j.p['Peck Q']?' Q'+f4(p('Peck Q')):''}`);
  for(let i=0;i<p('Holes');i++){const a=(p('Start°')+360*i/p('Holes'))*Math.PI/180;drill(p('Dia')/2*Math.cos(a),p('Dia')/2*Math.sin(a))}}
 if(j.op=='grid'){L(`G65 P9101 I${p('Rows')} J${p('Cols')} U${f4(p('Pitch X'))} V${f4(p('Pitch Y'))} Z${f4(p('Depth'))} R${f4(cz)} F${f4(p('Feed'))}${j.p['Peck Q']?' Q'+f4(p('Peck Q')):''}`);
  for(let r=0;r<p('Rows');r++)for(let k=0;k<p('Cols');k++)drill(k*p('Pitch X'),r*p('Pitch Y'))}
 if(j.op=='face'){const Ln=p('Length'),Wd=p('Width'),d=p('Cutter'),so=d*p('Stepover %')/100;L(`G65 P9102 X${f4(Ln)} Y${f4(Wd)} D${f4(d)} K${f4(so)} E${f4(p('Stepdown'))} Z${f4(p('Depth'))} F${f4(p('Feed'))}`);
  let zz=0;while(zz<p('Depth')-1e-6){zz=Math.min(p('Depth'),zz+p('Stepdown'));let y=0,dir=1;R(-d/2-0.1,0,null);R(null,null,cz);F(null,null,-zz,p('Feed'));while(y<=Wd+1e-6){F(dir>0?Ln+d/2+0.1:-d/2-0.1,y,null,p('Feed'));y+=so;if(y<=Wd+1e-6)F(null,y,null,p('Feed'));dir=-dir}R(null,null,cz)}R(null,null,cz+1)}
 R(null,null,cz+1);L('G80 M09');L('G52 X0 Y0 Z0 (CANCEL SHIFT)');L('G91 G28 Z0. (SAFE END)');L('G90 M05');L('M30');L('');
 // subprogram
 const chk=(v,n)=>L(`IF[#${v}EQ#0]GOTO${n}`);
 if(j.op=='bolt'){L('O9100 (BOLT CIRCLE)');[11,7,1,26,18,9].forEach(v=>chk(v,99));L('#100=0 (COUNT)');L('WHILE[#100LT#11]DO1');L('#101=#1+360*#100/#11');L('#102=#7/2*COS[#101]');L('#103=#7/2*SIN[#101]');L(`G90 G99 X#102 Y#103 ${cyc}`);L('#100=#100+1');L('END1');}
 if(j.op=='grid'){L('O9101 (HOLE GRID)');[4,5,21,22,26,18,9].forEach(v=>chk(v,99));L('#100=0');L('WHILE[#100LT#4]DO1');L('#101=0');L('WHILE[#101LT#5]DO2');L(`G90 G99 X[#101*#21] Y[#100*#22] ${cyc}`);L('#101=#101+1');L('END2');L('#100=#100+1');L('END1');}
 if(j.op=='face'){L('O9102 (FACE MILL)');[24,25,7,6,8,26,9].forEach(v=>chk(v,99));L('#110=0 (Z DONE)');L('WHILE[#110LT#26]DO2');L('#110=#110+#8');L('IF[#110GT#26]THEN #110=#26');L('#100=0 (Y)');L('#101=1 (DIR)');L('G00 X[-#7/2-0.1] Y0');L('G01 Z-#110 F#9');L('WHILE[#100LE#25]DO1');L('IF[#101GT0]THEN #102=#24+#7/2+0.1');L('IF[#101LT0]THEN #102=-#7/2-0.1');L('G01 X#102 Y#100');L('#100=#100+#6');L('IF[#100LE#25]THEN G01 Y#100');L('#101=-#101');L('END1');L('G00 Z0.1');L('END2');L('G00 Z1.');}
 L('G80');L('M99');L('N99 #3000=1 (MISSING ARGUMENT)');L('M99');L('%');
 // stock bounds
 let st;if(j.op=='bolt'){const r=p('Dia')/2+0.75;st=[-r,-r,-p('Depth')-0.25,r,r,0]}else if(j.op=='grid')st=[-0.5,-0.5,-p('Depth')-0.25,(p('Cols')-1)*p('Pitch X')+0.5,(p('Rows')-1)*p('Pitch Y')+0.5,0];else st=[0,0,-0.5,p('Length'),p('Width'),0];
 mv.forEach(m=>{if(!m.r&&(m.b[2]<st[2]))m.out=1,out++});j.stock=st;return{code:c,moves:mv,out}}
const fmt=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
function saveJob(){S.jobs.unshift({...J,date:Date.now(),machine:(S.m[S.cur]||{}).name});save();tab('recent')}
function recent(){$('#ttl').textContent='Recent';V.innerHTML=S.jobs.length?S.jobs.map((j,i)=>`<div class="card" onclick="reopen(${i})"><div class="t">${OPN[j.op]} · ${j.machine||''}</div><div class="s">${new Date(j.date).toLocaleString()}</div><div class="s">${esc(j.text)}</div></div>`).join(''):`<div class="card"><div class="s">No saved jobs yet. Try a sample:</div>${SAMPLES.map((s,i)=>`<button class="chip y" onclick="sample(${i})">${s[1]}</button>`).join('')}</div>`}
function reopen(i){J=JSON.parse(JSON.stringify(S.jobs[i]));const k=S.m.findIndex(m=>m.name==J.machine);if(k>=0)S.cur=k;tab('new');show()}
// ---------- work offsets (canonical: 'G54'..'G59' or 'P1'..'P300')
function normOff(t){t=String(t).toLowerCase();let m=t.match(/g54\.1\s*p\s*(\d+)|g54\s*p\s*(\d+)/);if(m)return'P'+(m[1]||m[2]);m=t.match(/g1(1\d|2\d)\b/);if(m)return'P'+(+m[1]-9);m=t.match(/\bp\s*(\d+)\b/);if(m&&!/peck/.test(t))return'P'+m[1];m=t.match(/g5[4-9]\b/);return m?m[0].toUpperCase():null}

function scan(){const t=$('#sq').value.toUpperCase().replace(/\([^)]*\)/g,''),L=isL(),seen={};
 (t.match(/[GM]\d+(\.\d)?/g)||[]).forEach(c=>{const k=c[0]+(c.includes('.')?c.slice(1).padStart(4,'0'):c.slice(1).padStart(2,'0'));seen[k]=(seen[k]||0)+1});
 (t.match(/G1[1-2]\d\b/g)||[]).forEach(c=>{seen[c]=seen[c]});
 const rows=Object.keys(seen).sort().map(k=>{let d=GD[k],f='';if(/^G1[1-2]\d$/.test(k)){d='Haas-style extended work offset';f=/G110/.test((sv('Offset syntax')||{v:''}).v)?'':'This machine is set to '+(sv('Offset syntax')||{}).v}
  if(k=='G54.1'){f=extN()?'':'Machine has no extended offsets'}if(!d)f='Unknown / not in the library — check the control manual';else if(L&&MONLY.includes(k))f='Mill code on a lathe — check';else if(!L&&LONLY.includes(k)&&k!='G50')f='Lathe code on a mill — check';
  return`<div class="set"><span><b class="v" style="color:#14b8a6">${k}</b> ${d||'?'} <span class="s">×${seen[k]}</span>${f?`<br><span class="chip r">! ${f}</span>`:''}</span></div>`});
 const mac=(t.match(/WHILE|IF\[|#\d+/g)||[]).length;$('#so').innerHTML=`<div class="card"><div class="t">${Object.keys(seen).length} codes found</div>${rows.join('')}<div class="s" style="margin-top:6px">${mac?mac+' macro items (#vars, IF, WHILE) found.':'No macro statements.'} Meanings are plain-English summaries; control behavior varies — confirm on yours.</div></div>`}
