<div class="h"><span id="ttl">My Machines</span><span class="hr"><span class="units" role="group" aria-label="Length units"><button type="button" id="u-in" aria-pressed="true">in</button><span class="sep">|</span><button type="button" id="u-mm" aria-pressed="false">mm</button></span><small>● Offline</small></span></div>

<script>
const $=s=>document.querySelector(s),V=$('#v');
const PRESETS={'Vertical mills':['Generic 3-axis VMC','Generic VMC w/ 4th axis','Small toolroom mill'],'Horizontal mills':['Generic HMC w/ pallet','Generic HMC 4-axis'],'Lathes':['Generic 2-axis lathe','Lathe w/ live tooling','Lathe w/ sub-spindle']};
const SETS=[['Control','Fanuc-style'],['Units','Inch'],['Rapid rate (in/min)','400'],['Program memory (lines)','8000'],['Probe','none'],['Skip code (probe)','G31',1],['Rigid tap style','M29 S (before G84)',1],['Rotary axis','A',1],['Rotary direction','+ = CCW looking from +X end',1],['Extended offsets','none',1],['Offset syntax','G54.1 Pn',1],['Max RPM','8000']];
const LSETS=[['Control','Fanuc-style'],['Units','Inch'],['Rapid rate (in/min)','400'],['Program memory (lines)','8000'],['Diameter mode','Diameter',1],['Extended offsets','none',1],['Offset syntax','G54.1 Pn',1],['Tool numbering','T0101'],['Max RPM (G50)','3000',1],['Spindle mode','G96 CSS']];
const isLT=t=>/lathe/i.test(t);
function mk(name,type,user){return{id:Date.now()+Math.random(),name,type,s:(isLT(type)?LSETS:SETS).map(([k,v],i)=>({k,v,st:i==0||(isLT(type)?LSETS:SETS)[i][2]?'confirm':(user||[]).includes(k)?'user':'suggested'}))}}
let S=JSON.parse(localStorage.getItem('mc')||'null')||{m:[mk('Mill A','demo VMC',['Units','Rapid rate (in/min)']),mk('Mill B','demo VMC 4th',['Units']),mk('Lathe 1','demo lathe',[])],jobs:[],cur:0};
S.m.forEach(m=>{if((isLT(m.type)&&!m.s.find(x=>x.k=='Diameter mode'))||!m.s.find(x=>x.k=='Extended offsets'))m.s=mk(m.name,m.type).s});
const save=()=>localStorage.setItem('mc',JSON.stringify(S));
function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({machines,new:nw,recent,more})[t]();scrollTo(0,0)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
const pct=m=>Math.round(100*m.s.filter(x=>x.st=='user').length/m.s.length);
const cls={user:'g',suggested:'gr',confirm:'r'},ic={user:'✓',suggested:'~',confirm:'!'};
function machines(){$('#ttl').textContent='My Machines';
V.innerHTML=S.m.map((m,i)=>`<div class="card" onclick="edit(${i})"><div class="t">${i==S.cur?'⭐ ':''}${m.name} <span style="color:#999;font-weight:400">· ${m.type}</span></div><div class="s">${m.s[0].v} · ${m.s[1].v}</div><div class="bar"><i style="width:${pct(m)}%"></i></div><div class="s">Setup ${pct(m)}% · ${m.s.filter(x=>x.st=='confirm').length} to confirm</div>${m.s.map(x=>`<span class="chip ${cls[x.st]}">${ic[x.st]} ${x.k}</span>`).join('')}</div>`).join('')+
`<button class="btn" onclick="addM()">+ Add machine</button><div class="s" style="margin-top:10px">Demo machines only. Green = you set it · gray = suggested · red = confirm on the control.</div>`}
function addM(){$('#ttl').textContent='Presets';V.innerHTML=Object.entries(PRESETS).map(([g,l])=>`<div class="card"><div class="t">${g}</div>${l.map(n=>`<button class="chip gr" onclick="pick('${n}','${g}')">${n}</button>`).join('')}</div>`).join('')+'<div class="s">Not affiliated with any machine maker. Generic presets only.</div>'}
function pick(n,g){S.m.push(mk(n,g.replace(/s$/,'').toLowerCase()));{const m=S.m.at(-1);m.opt=m.opt||{macroB:1};m.optOk=0;m.tools=m.tools||JSON.parse(JSON.stringify((S.m[0]||{}).tools||[]));if(/horizontal/.test(m.type)){const r=m.s.find(x=>x.k=='Rotary axis');if(r)r.v='B';m.opt.ax4=1}}save();edit(S.m.length-1)}
function edit(i){const m=S.m[i];$('#ttl').textContent=m.name;
V.innerHTML=`<div class="card"><input id="mn" value="${m.name}"><div class="bar"><i style="width:${pct(m)}%"></i></div><div class="s">Setup ${pct(m)}%</div>${m.s.map((x,j)=>`<div class="set"><span><span class="chip ${cls[x.st]}" onclick="S.m[${i}].s[${j}].st='user';save();edit(${i})">${ic[x.st]}</span> ${x.k}</span><input style="width:45%" data-j="${j}" value="${x.v}"></div>`).join('')}<div class="s">Editing a value marks it green (you set it). Red items: check them on the control, then tap the red chip to confirm.</div></div><button class="btn" onclick="cur(${i})">Use this machine</button><button class="btn o" onclick="tab('machines')">Back</button>`;
$('#mn').onchange=e=>{m.name=e.target.value;save()};V.querySelectorAll('input[data-j]').forEach(el=>el.onchange=()=>{const x=m.s[el.dataset.j];x.v=el.value;x.st='user';save();edit(i)})}
function cur(i){S.cur=i;save();tab('new')}
// ---------- parser
const W={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,twelve:12};
let J=null;
function num(re,t){const m=t.match(re);return m?parseFloat(m[1]):null}
function parse(t){t=t.toLowerCase().replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|twelve)\b/g,w=>W[w]);
 const p={},G=(k,v,g)=>p[k]={v,g:!!g};let op;
 if(/bolt ?circle|bc\b|holes? on a/.test(t))op='bolt';else if(/grid|array|rows?|x\s*\d+\s*(holes|grid)/.test(t))op='grid';else if(/face|facing/.test(t))op='face';else return null;
 const d=num(/(-?[\d.]+)\s*(?:"|in)?\s*deep|depth\s*(?:of\s*)?(-?[\d.]+)/,t)??num(/depth\s*(?:of\s*)?([\d.]+)/,t);
 if(op=='bolt'){G('Holes',num(/(\d+)\s*(?:-?\s*hole|x)/,t));G('Dia',num(/([\d.]+)\s*(?:"|in)?\s*(?:dia|diameter|bc|bolt)/,t)??num(/dia(?:meter)?\s*(?:of\s*)?([\d.]+)/,t));
  const a=num(/(?:start(?:ing)?\s*(?:angle|at)?\s*)(-?[\d.]+)/,t);G('Start°',a??0,a==null);}
 if(op=='grid'){const m=t.match(/(\d+)\s*(?:rows?\s*(?:by|x)\s*|x\s*)(\d+)/);G('Rows',m?+m[1]:null);G('Cols',m?+m[2]:null);
  const sp=num(/([\d.]+)\s*(?:"|in)?\s*(?:spacing|apart|pitch)/,t)??num(/spac(?:ing|ed)\s*(?:of\s*)?([\d.]+)/,t);G('Pitch X',sp);G('Pitch Y',num(/([\d.]+)\s*(?:"|in)?\s*y\s*(?:spacing|pitch)/,t)??sp);}
 if(op=='face'){const m=t.match(/([\d.]+)\s*(?:"|in)?\s*(?:x|by)\s*([\d.]+)/);G('Length',m?+m[1]:null);G('Width',m?+m[2]:null);
  const c=num(/([\d.]+)\s*(?:"|in)?\s*(?:cutter|face mill|mill)/,t);G('Cutter',c??2,c==null);const st=num(/stepover\s*([\d.]+)/,t);G('Stepover %',st??70,st==null);}
 if(op=='face'){const z=num(/(?:take|remove|depth)\s*(?:off\s*)?([\d.]+)/,t);G('Depth',z??0.02,z==null)}else G('Depth',d);
 if(op!='face'){const pk=/peck|g83/.test(t);G('Cycle',pk?'Peck G83':'Drill G81',!/peck|drill|g8[13]/.test(t));if(pk){const q=num(/peck\s*(?:of\s*)?([\d.]+)/,t);G('Peck Q',q??0.05,q==null)}}
 if(op!='face'){const dd=num(/([\d.]+)\s*(?:"|in)?\s*drill/,t);G('Drill Ø',dd??0.25,dd==null)}
 const f=num(/\b(?:feed|f)\s*([\d.]+)/,t);G('Feed',f??(op=='face'?30:8),f==null);const r=num(/(?:rpm|s)\s*(\d{3,5})/,t)??num(/(\d{3,5})\s*rpm/,t);G('RPM',r??(op=='face'?3000:2500),r==null);
 const tl=num(/\bt(?:ool)?\s*(\d+)/,t);G('Tool',tl??1,tl==null);G('Clear Z',0.1,true);
 return{op,p,text:t}}
const OPN={bolt:'Bolt circle',grid:'Hole grid',face:'Face mill',lturn:'OD turn',lface:'Lathe face',lgroove:'OD groove',ldrill:'Center drill'};
function nw(){$('#ttl').textContent='New job · '+(S.m[S.cur]||{name:'?'}).name;
V.innerHTML=`<textarea id="q" rows="3" placeholder="${isL()?'e.g. G54 T1 turn 2.0 bar to 1.5 dia 3 long z0 0':'e.g. G54 T2 6 hole bolt circle 3.0 dia center x0 y0 z0 0 start 15 0.5 deep peck'}">${J?J.text:''}</textarea><div class="row" style="margin-top:6px">${isNT()?`<button class="chip y" onclick="ex('G54 multitask turn 1.0 bar to 0.75 dia 1.5 long z0 0 flat 0.08 deep 0.5 long cross drill 0.25 at z-1.0 0.2 deep center drill 0.2 deep part off 0.125')">Multitask sample</button><button class="chip gr" onclick="ex('G54 multitask turn 1.0 bar to 0.75 dia 1.5 long z0 0 part off 0.125')">Turn + transfer</button>`:isSw()?`<button class="chip y" onclick="ex('G54 swiss turn 0.5 bar to 0.375 dia 0.8 long z0 0 flat 0.05 deep 0.3 long cross drill 0.125 at z-0.55 0.15 deep center drill 0.1 deep part off 0.062')">Combined sample</button><button class="chip gr" onclick="ex('G54 swiss turn 0.5 bar to 0.375 dia 0.8 long z0 0 part off 0.062')">Turn + part-off</button>`:isL()?`<button class="chip gr" onclick="lcyc('g71')">G71/G70 cycle</button><button class="chip gr" onclick="lcyc('g76')">G76 thread</button><button class="chip gr" onclick="lcyc('m98')">M98 + G66</button><button class="chip gr" onclick="ex('G54 lathe probe od 1.0 dia at z-0.5 write wear 1')">Probe OD</button><button class="chip gr" onclick="ex('G54 T1 turn 2.0 bar to 1.5 dia 3 long z0 0 chamfer 0.03')">OD turn</button><button class="chip gr" onclick="ex('G54 T1 face 0.05 off 2.0 bar z0 0')">Face</button><button class="chip gr" onclick="ex('G54 T3 groove 0.25 wide 0.1 deep at z-1.0 2.0 bar insert 0.125 z0 0')">Groove</button><button class="chip gr" onclick="ex('G54 T5 center drill 0.5 deep peck 0.1 z0 0')">Drill</button>`:`<button class="chip gr" onclick="ex('G54 T2 6 hole bolt circle 3.0 dia center x0 y0 z0 0 start 15 0.5 deep peck 0.1')">Bolt circle</button><button class="chip gr" onclick="ex('G54 T2 3 x 4 grid 0.75 spacing start x0 y0 z0 0 0.4 deep drill')">Grid</button><button class="chip gr" onclick="ex('G54 T6 rigid tap 1/4-20 4 hole bolt circle 2.0 dia center x0 y0 z0 0 start 45 0.5 deep 600 rpm')">Tap</button><button class="chip gr" onclick="ex('G54 T2 index 4 faces hole x1.0 y0 z0 0.75 0.3 deep drill')">4th axis</button><button class="chip gr" onclick="ex('G54 T20 probe bore 2.0 dia center x0 y0 probe z -0.25 tip 0.157 write to g55')">Probe</button><button class="chip gr" onclick="ex('G54 T1 face 4 x 3 with 2 cutter take off 0.06 stepdown 0.02 stepover 70 z0 0')">Face</button>`}</div><button class="btn" onclick="go()">Make my macro</button><div id="out"></div>`}
function ex(s){$('#q').value=s;go()}
function go(){const j=req((isL()?parseL:parse)($('#q').value));if(!j){$('#out').innerHTML=`<div class="ok bad">${isL()?'Try “turn”, “face”, “groove”, or “center drill”.':'Try “bolt circle”, “grid”, or “face mill”.'}</div>`;return}J={...j,date:Date.now(),edits:{}};show()}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function ed(k){const x=J.p[k],v=prompt(k=='Work offset'?'Work offset — this machine allows: G54–G59'+(extN()?`, ${offLbl('P1')}…${offLbl(offOpts().at(-1))}`:''):k,k=='Work offset'?offLbl(x.v||''):x.v??'');if(v==null)return;x.v=k=='Work offset'?normOff(v):isNaN(+v)?v:+v;x.g=false;show()}
function fill(){V.querySelectorAll('[data-k]').forEach(el=>{if(el.value!=='')J.p[el.dataset.k]={v:el.dataset.k=='Work offset'?normOff(el.value):isNaN(+el.value)?el.value.toUpperCase():+el.value,g:false}});show()}
// ---------- generator: Macro B main + subprogram, and simulated moves
let GENMM=0;function f4(n){const t=(+n).toFixed(GENMM?7:4).replace(/0+$/,'').replace(/\.$/,'.0');return GENMM?t+'\u0002':t}
// built-in inch constant -> its round metric twin (only while writing a mm program)
function C(x){return GENMM?nice(x*25.4)/25.4:x}
function gen(j){const p=k=>j.p[k]?j.p[k].v:0,c=[],mv=[];let pos=[0,0,2],out=0;
 const L=s=>c.push(s);const R=(x,y,z)=>{mv.push({a:[...pos],b:[x??pos[0],y??pos[1],z??pos[2]],r:1});pos=mv.at(-1).b},F=(x,y,z,f)=>{mv.push({a:[...pos],b:[x??pos[0],y??pos[1],z??pos[2]],f});pos=mv.at(-1).b};
 const T=p('Tool'),cz=p('Clear Z');
 L('%');L('O1000 ('+OPN[j.op].toUpperCase()+' - DEMO)');L('(GENERIC FANUC-STYLE MACRO B - VERIFY ON CONTROL)');
 L('G17 G20 G40 G49 G80 G90 (SAFE START)');L(`T${T} M06`);L(`${offCode(p('Work offset'))} G00 X0. Y0. S${p('RPM')} M03`);{const sx=j.p['Center X']||j.p['Start X'],sy=j.p['Center Y']||j.p['Start Y'];L(`G52 X${f4(sx?sx.v:0)} Y${f4(sy?sy.v:0)} Z${f4(p('Z0'))} (LOCAL SHIFT TO PART ZERO)`)}L(`G43 H${T} Z${f4(cz+C(1))} M08`);
 const drill=(x,y)=>{const d=-p('Depth'),q=p('Peck Q');R(x,y,null);R(null,null,cz);if(j.p['Peck Q']){let z=0;while(z>d){const nz=Math.max(d,z-q);F(null,null,nz,p('Feed'));R(null,null,cz);if(nz>d)R(null,null,nz+0.01);z=nz}}else{F(null,null,d,p('Feed'));R(null,null,cz)}};
 const cyc=j.p['Peck Q']?`G83 Z-#26 R#18 Q#17 F#9`:`G81 Z-#26 R#18 F#9`;
 R(0,0,cz+1);
 if(j.op=='bolt'){L(`G65 P9100 H${p('Holes')} D${f4(p('Dia'))} A${f4(p('Start°'))} Z${f4(p('Depth'))} R${f4(cz)} F${f4(p('Feed'))}${j.p['Peck Q']?' Q'+f4(p('Peck Q')):''}`);
  for(let i=0;i<p('Holes');i++){const a=(p('Start°')+360*i/p('Holes'))*Math.PI/180;drill(p('Dia')/2*Math.cos(a),p('Dia')/2*Math.sin(a))}}
 if(j.op=='grid'){L(`G65 P9101 I${p('Rows')} J${p('Cols')} U${f4(p('Pitch X'))} V${f4(p('Pitch Y'))} Z${f4(p('Depth'))} R${f4(cz)} F${f4(p('Feed'))}${j.p['Peck Q']?' Q'+f4(p('Peck Q')):''}`);
  for(let r=0;r<p('Rows');r++)for(let k=0;k<p('Cols');k++)drill(k*p('Pitch X'),r*p('Pitch Y'))}
 if(j.op=='face'){const Ln=p('Length'),Wd=p('Width'),d=p('Cutter'),so=d*p('Stepover %')/100;L(`G65 P9102 X${f4(Ln)} Y${f4(Wd)} D${f4(d)} K${f4(so)} E${f4(p('Stepdown'))} Z${f4(p('Depth'))} F${f4(p('Feed'))}`);
  let zz=0;while(zz<p('Depth')-1e-6){zz=Math.min(p('Depth'),zz+p('Stepdown'));let y=0,dir=1;R(-d/2-0.1,0,null);R(null,null,cz);F(null,null,-zz,p('Feed'));while(y<=Wd+1e-6){F(dir>0?Ln+d/2+0.1:-d/2-0.1,y,null,p('Feed'));y+=so;if(y<=Wd+1e-6)F(null,y,null,p('Feed'));dir=-dir}R(null,null,cz)}R(null,null,cz+1)}
 R(null,null,cz+1);L('G80 M09');L('G52 X0 Y0 Z0 (CANCEL SHIFT)');L('G91 G28 Z0. (SAFE END)');L('G90 M05');L('M30');L('');
 // subprogram

['machines','Setting up a machine',()=>`<p>Machines → tap a card to edit it. Each setting shows a chip:</p><p><span class="chip g">✓ green</span> you set it. <span class="chip gr">~ gray</span> a suggestion you can change. <span class="chip r">! red</span> must be checked on the real control — tap the red chip once you've checked.</p><p>Below the settings: <b>Options</b> (tick what the machine really has, then confirm), <b>Probes</b> (add, nickname, pick a default), Duplicate, and the units override. Sourced M-codes show their source; anything without a public source stays red for you to type from your manual.</p><p>★ Favorite pins a machine to the top. "Use" makes it the current machine.</p>`],
['offsets','Work offsets (incl. extended)',()=>`<p>G54–G59 are the standard six. Extended offsets (e.g. G54.1 P1–P48 on Fanuc-style, G110–G129 or G154 P1–P99 on Haas) only work if the machine has them: set <b>Extended offsets</b> and <b>Offset syntax</b> in the machine and confirm them on the control. A job that asks for an offset the machine doesn't have is flagged.</p>`],
['build','Building a macro (inputs and units)',()=>`<p>Type the job in plain words. Numbers are read in the active units (${UN()=='mm'?'mm':'inch'}). Missing items appear as red questions; yellow chips came from your words; gray are suggestions.</p>${helpJobs()}<p>Tap: say "rigid tap 1/4-20" (inch) or "rigid tap m6x1" (mm). If something isn't possible on this machine you'll see work-around ideas marked "suggestion, verify" — they're never added to your program.</p>`],
['ask','The ask-first variable card',()=>`<p>Generated macros use common variables (like #100–#103) as scratch space. Other programs or probe software may use the same ones. Before any code appears, a card lists them and asks if they're free on this machine.</p><p><b>They're free</b> saves that range on the machine so you aren't asked again. <b>Override this once</b> shows the code but keeps the check red.</p>`],
['editor','The editor and checks',()=>`<p>Every line is editable. Colors: G/M codes teal, macro words yellow, variables pink, comments gray. Line numbers on the left; a red line with ⚠ has a problem (unbalanced brackets, divide by zero, a variable out of range, an unknown G-code).</p><p>Find, Undo/Redo, snippets and the Alarm preview sit with the code. The bar at the top says how many checks fail — tap it for the list. Source notes (collapsed) say where each code comes from.</p>`],
['ready','The Ready badge',()=>`<p><span class="chip g">✓ Ready</span> means every check passes. <span class="chip r">Not ready</span> means at least one fails; fix it, or use Override only if you've proven the program on the control.</p>`],
['sim','Simulator controls and colors',()=>`<p>Drag to rotate, ＋/－ to zoom, Top/Front/Iso/Fit for views. Play, Step and the slider sit in the bar at the bottom; 1× cycles the speed.</p><p>Colors: <b style="color:#ffd21f">yellow dashed</b> = rapid, <b style="color:#14b8a6">teal</b> = feed, <b style="color:#ff4d4d">red</b> = outside the stock or below centerline.</p><p>Chips: Tool on/off, Stock on/off (shows material removed; custom form tools use their profile), Full screen. "Code at the tool" shows the line being run; the Variables card shows values at the current step.</p>`],
['scanner','The scanner and suggestions',()=>`<p>More → G-code scanner. Paste or load a program. It lists every code and flags unknown ones, then suggests: duplicate blocks, wasted rapids, drilling written longhand → G81, repeated passes → a WHILE loop, and machine options you could use. Each shows before/after, a reason and a source. Accept rewrites the scanner text only; Copy copies the block.</p>`],
['library','The library and versions',()=>`<p>Save to Library with a name, notes and a tool-life note. Saving again with the same name keeps the old one as a version and writes a short change note. Search finds text in names, notes and code. Version history opens any older copy.</p>`],
['units','Inch / mm',()=>`<p>The in | mm switch in the header changes every screen: inputs, chips, code (G20/G21), the simulator and the tool library. Values are kept inside so switching doesn't lose precision. A machine can be locked to one unit in its settings (red until confirmed). Programs whose G20/G21 don't match the machine are flagged.</p>`],
['backup','Backup, restore and PIN',()=>`<p>More → Your data: download a backup file (machines, tools, library), restore or merge one, or clear everything. A PIN lock keeps the app closed on a shared phone. Everything stays on this phone — nothing is sent anywhere.</p>`],
['export','File export and transfer',()=>`<p>After ticking "I'll verify on the control": Copy, .nc, .txt, .eia or Share. Options: line endings (CRLF/LF), a header comment (machine, date, units, control) and a "dry-run?" reminder. More → Transfer notes has plain tips for USB, memory card, RS-232/DNC and network shares.</p>`],
['haas','Haas vs Fanuc 0i',()=>`<p>When a machine's control says Haas or Fanuc 0i, extra checks run from a sourced public data set. Typical differences: Haas keeps #100–#199 and #500–#999 through power off, while Fanuc usually clears #100–#199; Haas extended offsets are G110–G129 / G154 P1–P99, Fanuc-style is G54.1 Pn; option M-codes differ by builder. The Reference screen has a "notes" filter for the selected control. Always confirm on your machine.</p>`],
['faq','FAQ and troubleshooting',()=>`<p><b>No code appears.</b> Answer the red questions, or the ask-first card, or turn on the needed option (Macro B, probing, G10) after checking the control.</p><p><b>Copy/export greyed out.</b> Tick "I'll verify on the control".</p><p><b>Numbers look wrong.</b> Check the in | mm switch and the machine's units setting.</p><p><b>Simulator says "your text has an error".</b> An edit broke the program — red lines in the editor show where; Undo helps.</p><p><b>Lost my work?</b> Restore a backup file from More → Your data.</p><p><b>Is any of this real machine data?</b> No — generic demo machines. Sourced values say where they come from; verify on the control.</p>`]];

function eLayout(text,H,gap){const s=H/6,out=[];let x=0;const g=eGlyphs(text);g.forEach((d,i)=>{if(d)d.split('|').filter(Boolean).forEach(st=>out.push(st.split(' ').map(p=>{const [a,b]=p.split(',').map(Number);return[x+a*s,b*s]})));x+=4*s+(i<g.length-1?gap:0)});return{strokes:out,W:x}}
const ER=d=>d*Math.PI/180,ED=r=>r*180/Math.PI;

const EMN={flat:'Flat on top of the shaft (3-axis, Z follows the curve)',awrap:'Wrapped around the 4th (A) axis',lwrap:'Wrapped around C on the OD (live tool)',lface:'On the part face with X/C (live tool)',mface:'On a flat face (XY)'};

function eWidth(t,d){if(!t)return null;if(t.ang>0)return (t.tip||0)+2*d*Math.tan(ER(t.ang/2));return t.tip||t.dia||null}
// all text points in surface coords. returns {strokes:[[{...machine coords}]], W, sa:[min,max], ...}
function eGeom(j){j=j||J;const p=k=>{const x=j.p[k];return x?x.v:undefined};const H=p('Letter height'),gap=p('Letter spacing')??H*0.25,mir=/^Y/i.test(p('Mirror')||''),meth=eMeth(j);
 const L=eLayout(p('Text')||'',H,gap),W=L.W;let st=L.strokes.map(s=>s.map(([x,y])=>[mir?W-x:x,y]));
 const sub=(s)=>{const o=[s[0]];for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/(H/8)));for(let k=1;k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return o};
 st=st.map(sub);const g={W,H,meth,mir};
 if(j.emode=='circle'){const Rc=p('Arc radius'),cx=p('Arc center X'),cy=p('Arc center Y'),cw=/^CW/i.test(p('Direction')||''),out=!/^IN/i.test(p('Placement')||''),dir=cw?-1:1;let a0=p('Start angle');if(/^C/i.test(p('Angle is')||''))a0=a0-dir*ED(W/2/Rc);
  g.span=ED(W/Rc);g.Rc=Rc;g.cx=cx;g.cy=cy;g.dir=dir;g.out=out;g.a0=a0;
  // reading along +dir; tops out: r=Rc+y; tops in: r=Rc-y. Viewed from +Z, CW+outside and CCW+inside read normally.
  g.uv=st.map(s=>s.map(([x,y])=>{const f=ER(a0)+dir*x/Rc,r=out?Rc+y:Rc-y;return[cx+r*Math.cos(f),cy+r*Math.sin(f)]}));
  g.norm=(cw==out)?'reads normally from the front (+Z view)':'reads mirrored-looking from the front - pick the other direction or Mirror if that is not what you want';return g}
 const th=ER(p('Baseline rotation')||0),c=Math.cos(th),s=Math.sin(th);st=st.map(q=>q.map(([x,y])=>[x*c-y*s,x*s+y*c]));g.rot=p('Baseline rotation')||0;

// direction words for "up" and "reads toward"
function eOrient(j){j=j||J;const g=eGeom(j);const meth=g.meth;if(j.emode=='circle')return `Letters are turned tangent to the circle, tops facing ${g.out?'out (away from the center)':'in (toward the center)'}, text runs ${g.dir<0?'clockwise':'counter-clockwise'} seen from +Z (looking at the face), spacing measured along the arc. It ${g.norm}.`;
 const th=ER(g.rot),r=[Math.cos(th),Math.sin(th)],u=[-Math.sin(th),Math.cos(th)];if(g.mir)r[0]=-r[0],r[1]=-r[1];
 const nm=(v)=>{const f=([a,b])=>j.emode=='face'?[a,b]:g.along?[a,b]:[b,a];const [a,b]=f(v);const big=Math.abs(a)>=Math.abs(b);

  if(big){if(meth=='lwrap')return a>0?'−Z (toward the chuck)':'+Z (toward the face)';return a>0?'+X (along the shaft)':'−X (along the shaft)'}

 const flipX=g.meth=='lwrap';const X=p=>flipX?-p:p;xs=xs.map(X);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),sp=Math.max(x1-x0,y1-y0,1e-3),k=200/sp,w=(x1-x0)*k+40,h=(y1-y0)*k+40;
 const T=p=>[(X(p[0])-x0)*k+20,(y1-p[1])*k+20];let s=`<svg viewBox="0 0 ${w.toFixed(0)} ${h.toFixed(0)}" style="width:100%;max-height:170px;background:#0b1620;border-radius:8px">`;
 if(j.emode=='circle'){const c=T([g.cx,g.cy]);s+=`<circle cx="${c[0]}" cy="${c[1]}" r="${g.Rc*k}" fill="none" stroke="#456" stroke-dasharray="4 4"/><circle cx="${c[0]}" cy="${c[1]}" r="2" fill="#888"/>`}

 const f=T(g.uv[0][0]);s+=`<circle cx="${f[0]}" cy="${f[1]}" r="4" fill="#facc15"/>`;s+='</svg>';
 const lab=j.emode=='shaft'?(g.meth=='lwrap'?'← +Z (face) · −Z (chuck) →   ↑ around C':'→ +X along the shaft   ↑ '+(g.meth=='awrap'?'around A (unrolled)':'+Y across the top')):'→ +X   ↑ +Y   (looking down +Z)';
 return `<div class="card" id="eprev"><div class="t">Live preview — how the text reads</div>${s}<div class="s">${lab} · yellow dot = first stroke start.</div><div class="s">${esc(eOrient(j))}</div></div>`}

<p><b>How it's cut depends on the machine:</b> 3-axis mill = flat on top of the shaft, Z follows the curve (you give a depth tolerance; too wide text is blocked). Mill with a confirmed 4th axis = wrapped around A (arc length turned into degrees, Z at radius minus depth; G93 inverse time only if you confirm it in the machine, otherwise a combined feed with a warning). Lathe with live tools and C, NT and Swiss = wrapped around C on the OD (G07.1/G107 only if confirmed, else point-by-point C), or on the part face with X/C (G12.1/G112 only if confirmed, else point-by-point C). A lathe without live tools + C is blocked.</p>
<p><b>Always red (you give it):</b> text, letter height, depth, tool, work offset, zero point (shaft: Y0 Z0 on the centerline; lathe: X0 on the spindle center, Z0 on the face), mirrored yes/no. Shaft: shaft Ø, start along the axis, start angle and whether it is the start or the center, reading direction (along the axis or around), baseline rotation (0/90/180/270 or any angle). Flat face: text start X/Y and baseline rotation. <b>Text in a circle:</b> arc radius, arc center X/Y, start or centered-on angle, clockwise or counter-clockwise, and letters outside (tops out) or inside (tops in). Each letter is turned tangent to the circle and spacing is measured along the arc.</p>
<p><b>Gray suggestions:</b> letter spacing, RPM, feed, plunge feed, clearance.</p><p>The <b>live preview</b> card shows how the text will read and says in words which way the tops of the letters point. Checks: text fits around the shaft / within 360°, letter height vs. tool line width, depth vs. letter height, letter height vs. circle radius, rotary option and G93/G07.1/G12.1 confirmed when used. Add an <b>Engraving tool</b> in Tools with its tip width and included angle.</p>
<p><b>Wrapping and face modes by control</b> (only written when you confirm the option in Machines): Fanuc-style 0i — <i>G18 W0 H0</i> to pick the Z-C plane (that's Fanuc's own example, for a C axis set up as parallel to X; if your control sets C parallel to Y it wants G19 instead, and the G19 examples you may see online are mostly from other control makers), <i>G07.1 C</i>(cylinder radius) on, Z and C (degrees) moves, <i>G07.1 C0</i> off; face text uses <i>G12.1</i> … <i>G13.1</i> with X as a diameter and C as the made-up straight axis in radius. Haas lathe — <i>G19</i>, then <i>G107 Y0 C0 Q</i>(surface diameter) with Z and Y (distance around the surface) moves, plain <i>G107</i> to cancel, back to <i>G18</i>; face text uses <i>G17</i>, <i>G112</i> with X and Y measured from the spindle center, <i>G113</i> to cancel, back to <i>G18</i>. Neither mode allows a rapid inside it, so moves between letters are G01 at the feed. Some controls use G107/G112 numbers instead of G07.1/G12.1 depending on the G-code system — check your manual.</p>
<p><b>C-axis mode and brake codes</b> (lathe, NT, Swiss): two machine settings, <i>C-axis mode on / off</i> and <i>C-axis clamp / unclamp</i>, start red and empty. Type both M-codes from your machine manual (like “M__ / M__”) and tap the red chip. Until both are confirmed the job lists them as missing and writes no code — these numbers differ from builder to builder, so the app never guesses. <span style="color:#999">Public examples only, not defaults: Haas lathe manuals show M154 / M155 for C-axis engage / disengage and M14 / M15 for the main spindle brake on / off.</span></p>
<p><b>Simulator:</b> tap <b>Stock on</b> to see the letters cut as grooves (as wide as the tool at your depth) on the flat, on the 4th-axis wrap, on the lathe C wrap and in the circle. Moves above the surface stay as normal path lines.</p>`]);

<p><b>Rectangular pocket</b>: helical entry in the middle, climb (counter-clockwise) passes outward, last pass with your corner radius (must be at least the cutter radius; 0 = cutter radius). Helix pitch is a gray suggestion (about a 3° ramp).</p>
<p><b>Slot</b>: ramps down along the center line each stepdown; if the slot is wider than the cutter, a climb contour finishes the sides.</p>
<p><b>Helical bore</b>: one helix down at the bore size, then a flat pass. The cutter must be at least half the bore, or a slug is left — use Circular pocket then.</p>
<p><b>Hole chamfer</b>: for a 90° chamfer tool. The tip goes down twice the chamfer size and circles the hole so a 45° chamfer of your size is cut. A tool with a tip flat needs the tip Ø.</p>
<p><b>Custom peck drill</b>: pecks shrink by your % each time down to the minimum, with chip-break back-offs and a full retract every N pecks.</p>
<p><b>Counterbore pattern</b>: plunges if the cutter equals the counterbore, otherwise a helical ramp and a flat pass at each hole.</p>
<p><b>Date code engrave</b>: reads today from #3011 (YYYYMMDD on Fanuc-style and Haas) and cuts it as YYYYMMDD or YYMMDD with the Engrave text digits (subprograms O7110–O7119). Check the control clock.</p>

<p><b>Keyway / flat</b>: shaft lying along X. Depth is from the top of the shaft. Keyways need a center-cutting end mill no wider than the key.</p>

<p><b>Spindle load check</b>: a straight test cut split into pieces; after each piece the load variable is read and the program stops over your %. Haas: #1098 (vector drive) and G103 P1 to keep the read in step. Fanuc has no standard load variable — your builder gives one.</p>

<p><b>Y-axis flats / hex</b>: radial end mill; the end face makes each flat while Y sweeps across, stepping in X by your DOC (X is diameter, so each pass removes DOC per side and the last pass lands on X = across flats). Two red lathe settings: <i>Y-axis OD milling on / off</i> (plane/mode entry and exit — Haas live-tool training uses G19 for OD work and G18 to go back; Fanuc builders vary) and <i>C-axis clamp / unclamp</i> (written around every flat). Face work on the end of the part uses G17 instead (see Polygon). Check the Y sweep shown in the checks fits your Y travel.</p>

<p><b>Drift / trend alarm</b>: keeps the last N readings of a measured variable, averages them, message stop past warn, alarm past the limit.</p>

HELP.splice(Math.max(0,HELP.findIndex(h=>h[0]=='faq')),0,['jobs31','Builder jobs: safe home, lathe setter, probe + wear, wear updates, parts catcher, bar feeder / pallets, sub-spindle, Swiss checks and warm-up',()=>`<p>These jobs lean on codes the machine builder chooses. Every one of them is a <b>red machine setting</b> that starts empty; the gray hint in the box is only shown when a public source gives it (mostly Haas). Fanuc-style, Nakamura-Tome-style and Tsugami-style machines get no hint: type the code from your manual.</p>
<p><b>Safe home / program end</b>: spindle and coolant off, then Z home first on a mill (G91 G28 Z0.) or X home first on a lathe (Fanuc G28 U0. then W0.; Haas G53 X0 then Z0), or a park position you give in machine coordinates (G53). Ends M30 or M99.</p>
<p><b>Lathe tool setter</b>: setter arm down, measure, arm up (<i>Tool setter arm down / up</i>). Haas uses G212 H (tip direction; calibrate first). Fanuc uses G36 X / G37 Z with your measuring positions (<i>Setter X / Z position</i>) — the difference goes into the active offset.</p>
<p><b>Lathe probe + wear update</b>: one touch on the OD (or face), measured size = skip position − tip, wear change = nominal − measured, limited to your max, optional message stop, then G10 adds it (Fanuc G10 P U/W; Haas G10 L11 P U/W). Probe codes: <i>Lathe probe on / off</i>.</p>
<p><b>Wear update from a measurement</b>: reads the # your gauge or probe filled, same limit / stop / confirm, then adds to the wear (mill D or H with G91 G10; lathe X or Z wear).</p>
<p><b>Part off with parts catcher</b>: catcher in (<i>Parts catcher on / off</i>, Haas M36 / M37), cut, catcher out.</p>
<p><b>Bar feeder / pallet loop</b>: your bar feed code (Haas G105, alone on its line) or pallet change code (Haas M50), your part program by M98, counted to your quantity.</p>
<p><b>Sub-spindle pickup / transfer</b>: sub chuck open, sync on (Haas G199 / G198), sub to your approach and grip positions, clamp (Haas M110 / M111), then part off or open the main chuck (Haas M10 / M11), sub back, sync off.</p>
<p><b>Swiss</b> (Swiss-type machines only): bar-end check and part-ejected check read the input # your builder wired (Fanuc #1000–#1031, Haas #11nnn); warm-up steps the spindle through your RPM list while Z and X travel your limits (the Tsugami manual's warm-up uses 2-minute steps); parts per bar runs your part program, your re-chuck code, then your bar change code. Multi-path wait codes are not written.</p>`]);
