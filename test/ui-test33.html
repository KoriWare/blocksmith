     splbro:/WHILE\[#23LT6\]DO2\nM216[^\n]*\nG00 C\[0\.0\+#23\*360\/6\]\nM214/,hob:/G81 T20 L1[\s\S]*M213 S300[\s\S]*G80/,hexg32:/G32 X[\d.]+ F[\d.]+\n(G32 X[\d.]+ F[\d.]+\n){30}/};

   setv('Spindle orient M-code','M19');if(hk)setv('Option: M19 orient to any angle (Haas)','yes');else{setv('Orient parameter number','4077');setv('Orient parameter value now','512');setv('Orient parameter spindle (P)','1');setv('Spindle encoder counts per rev','4096');

  [['Haas VF-style VMC (generic)','Haas NGC','Haas mill'],['Generic 3-axis VMC','Fanuc 0i','Fanuc mill']].forEach(([p,ctl,nm])=>{const hk=/Haas/.test(nm);w.pick(p,'Vertical mills');w.cur(E('S.m.length')-1);setv('Control',ctl);setv('Spindle orient M-code','M19');
   if(hk)setv('Option: M19 orient to any angle (Haas)','yes');else{setv('Orient parameter number','4077');setv('Orient parameter value now','512');setv('Orient parameter spindle (P)','1');setv('Spindle encoder counts per rev','4096');setv('Parameter write OK','I understand this writes machine parameter P4077')}

   const code=E('txt().join("\\n")'),ck=E('checks(J).filter(c=>!c[1]).map(c=>c[0])');log(nm+' spline checks',!ck.length,ck.join('|'));log(nm+' spline codes',(hk?/M19 R#23[\s\S]*COS\[#25\]/:/N4077 P1 R#24[\s\S]*COS\[#25\][\s\S]*N4077 P1 R512\nG11/).test(code),code.split('\n').join(' / '))});

 }catch(e){log('exception',false,e.stack.replace(/\n/g,' | '))}document.getElementById('o').textContent=out.join('\n')},1500)};
