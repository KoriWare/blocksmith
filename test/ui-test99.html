 const fe=pr('End mill'),bl=pr('Ball nose'),bn=pr('Bull nose / corner radius'),dr=pr('Drill'),sd=pr('Spot / center drill'),ch=pr('Chamfer mill'),en=pr('Engraving tool'),un=pr('Mystery'),nl=pr(null);

 log("v109: chamfer 90° V with tip flat; engraving V with tip width",ch.P[0][0]==0.01&&Math.abs(ch.P[1][1]-0.245)<1e-9&&en.P[0][0]==0.01&&Math.abs(en.P[1][1]-0.245/Math.tan(Math.PI/6))<1e-9);
 log("v109: unknown / no library tool draws flat, no point; falls back to job Cutter",un.P[0][0]==0.5&&nl.P[0][0]==0.375&&nl.P[0][1]==0,JSON.stringify(nl));

 const ro=(code,l)=>E(`(()=>{const sv=J,sn=view.n;J={code:${JSON.stringify(code)},M:[{l:${l}}],lathe:${code[0]=='L'}};view.n=1;const r=r109ro();J=sv;view.n=sn;return r})()`);

 const lc=['L','G21','T0101','G96 S180 M03','G01 X20 F0.2','G97 S1500'];
