<!doctype html><meta charset="utf-8"><body><pre id="o"></pre><!-- v113l/n: face mill reads the Stock card on every mill class - runs ui-test125-run.html once per class (3-axis VMC, 4th-axis VMC, HMC/tombstone with front-face center zero, 5-axis VMC) and collects the results --><iframe id="g" style="position:fixed;inset:0;width:410px;height:900px;border:0"></iframe><script>
const MTS=['vmc3','vmc4','hmc','vmc5'];const out=[];let k=0;
const next=()=>{if(k>=MTS.length){const all=out.join('\n');o.textContent=all+'\nP='+(all.match(/^PASS/gm)||[]).length+' F='+(all.match(/^FAIL/gm)||[]).length;return}g.src='ui-test125-run.html?mt='+MTS[k];const t0=Date.now();const poll=setInterval(()=>{let s='';try{s=g.contentDocument.getElementById('o').textContent}catch(e){}if(/\nP=\d+ F=\d+$/.test(s)||Date.now()-t0>240000){clearInterval(poll);out.push(s.replace(/\nP=\d+ F=\d+$/,'')||('FAIL '+MTS[k]+' run timed out'));k++;next()}},500)};next();
</script>
